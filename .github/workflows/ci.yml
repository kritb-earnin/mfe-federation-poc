name: ci
on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poc/e2e exec playwright install --with-deps chromium
      - name: Start POC stack
        run: |
          pnpm --filter @poc/mock-api dev &
          pnpm --filter @poc/remote-react dev &
          pnpm --filter @poc/remote-vue dev &
          pnpm --filter @poc/shell-injected dev &
          sleep 8
      - run: pnpm test:e2e
        env:
          SHELL_A_URL: http://localhost:8090
